name: Build Windows exe

# Publishing a release on GitHub (Releases -> Draft a new release -> Publish) builds the exe
# and attaches it to that release. "Run workflow" builds a test artifact without a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm PowerMonitor.spec
      - name: Package exe with license files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/PowerMonitor | Out-Null
          Copy-Item dist/PowerMonitor.exe, LICENSE, THIRD_PARTY_NOTICES.md release/PowerMonitor/
          Copy-Item -Recurse licenses release/PowerMonitor/licenses
          Compress-Archive -Path release/PowerMonitor/* -DestinationPath release/PowerMonitor-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PowerMonitor-windows
          path: release/PowerMonitor/
      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release/PowerMonitor-windows.zip
